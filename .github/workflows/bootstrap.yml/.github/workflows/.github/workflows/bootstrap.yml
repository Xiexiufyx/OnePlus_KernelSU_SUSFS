name: Bootstrap

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Trim configs and generate 6.6.66 assets
        run: |
          set -e
          rm -rf configs/a14 configs/a15
          find configs/a16 -maxdepth 1 -name "*.json" ! -name "OP-ACE-5-PRO.json" -delete
          cat > configs/a16/OP-ACE-5-PRO-6.6.66.json <<'JSONEOF'
{"model": "OP-ACE-5-PRO-6.6.66", "soc": "sun", "branch": "wild/sm8750", "manifest": "oneplus_ace5_pro_6.6.66_w.xml", "android_version": "android15", "kernel_version": "6.6", "os_version": "A16", "lto": "thin", "zyc_compiler": "https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240723-release/Clang-19.0.0git-20240723.tar.gz", "c_compiler": "kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin", "rust_compiler": "", "bindgen": "", "rust_build": false, "disk_cleanup": false, "hmbird": true, "susfs": true, "opt": true, "ds": true, "bbg": true, "bbr": true, "bbr3": true, "ttl": true, "ip_set": true, "unicode": true, "ntsync": true, "blacklist_modules": "kernelsu,oplus_security_guard,oplus_qr_scan,oplus_score,oplus_vip_task,oplus_dns_cache,oplus_network_linkpower_module,oplus_data_module,oplus_secure_harden,oplus_security_keventupload,oplus_secure_guard_new,oplus_secure_guard,coresight_tpda,coresight_tgu,coresight_trace_noc,coresight_cti,coresight_qmi,coresight_dummy,coresight_remote_etm,coresight_tpdm,coresight_uetm,coresight_stm,coresight_tmc_sec,f_fs_ipc_log,qcom_iommu_debug,qti_battery_debug,rdbg,stm_heartbeat,stm_p_ost,stm_core,stm_ftrace,stm_console,spmi_pmic_arb_debug", "uname": "OP-WILD"}
JSONEOF
          mkdir -p manifests/a16
          cat > manifests/a16/oneplus_ace5_pro_6.6.66_w.xml <<'XMLEOF'
<?xml version="1.0" encoding="UTF-8"?>
<manifest>
  <remote fetch="https://git.codelinaro.org/clo/la" name="clo-la"/>
  <remote fetch="https://github.com/OnePlusOSS" name="origin"/>
  <remote fetch="https://github.com/WildKernels" name="wild"/>
  <project remote="wild" name="AnyKernel3" path="AnyKernel3" revision="0b46673ae91aee8d60bd6ee257b4d56d3f6a0114"/>
  <default remote="clo-la" revision="dummy_revision" sync-c="true" sync-tags="false"/>
  <project remote="origin" name="android_kernel_common_oneplus_sm8750" path="kernel_platform/common" revision="f7e124513bd3cc64aff1d30231d00e4fd977734f">
    <linkfile dest="kernel_platform/.source_date_epoch_dir" src="."/>
  </project>
  <project remote="origin" name="android_kernel_modules_and_devicetree_oneplus_sm8750" path="./" revision="3dac2f2ac10e7bdfdf854b95f4103be86fabe46b"/>
  <project remote="clo-la" name="kernel/prebuilts/build-tools" path="kernel_platform/prebuilts/kernel-build-tools" revision="434f141b6d22a773a163fa9c707b19b4d254d989" upstream="refs/heads/ks-kernel.lnx.4.0.r1-rel" groups="ddk"/>
  <project remote="clo-la" name="kernelplatform/prebuilts-master/clang/host/linux-x86" path="kernel_platform/prebuilts/clang/host/linux-x86" revision="b099698c583b8361ca771f3cc8d6af6f729f39b3" upstream="refs/heads/ks-kernel.lnx.4.0.r1-rel" groups="ddk"/>
</manifest>
XMLEOF
          echo "Done. configs/a16:"
          ls configs/a16
      - name: Commit and push
        run: |
          git config user.name "Xiexiufyx"
          git config user.email "1054534375@qq.com"
          git add -A
          git commit -m "Trim configs to Ace5 Pro only; add 6.6.66 A16 config"
          git push origin HEAD:main
