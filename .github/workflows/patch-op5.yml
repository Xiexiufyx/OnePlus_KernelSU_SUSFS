name: Patch OnePlus clear rej v2
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch build-kernel action
        env:
          B64: 
        run: |
          echo "$B64" | base64 -d > /tmp/p.py
          python3 /tmp/p.py
      - name: Commit and push
        run: |
          git config user.name "Xiexiufyx"
          git config user.email "1054534375@qq.com"
          git add .github/actions/build-kernel/action.yml
          git commit -m "clear rej in v2.2.0 branch after allowlist fix"
          git push
