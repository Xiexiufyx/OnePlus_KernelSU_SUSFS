name: Patch build workflow with diagnostics 3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        env:
          B64: 
        run: |
          echo "$B64" | base64 -d > /tmp/patch_diag.py
          python3 /tmp/patch_diag.py
      - name: Verify
        run: |
          grep -n "Dump build diagnostics" .github/workflows/build-kernel-release.yml || echo "PATCH FAILED"
      - name: Commit via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, urllib.request
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          p = '.github/workflows/build-kernel-release.yml'
          content = open(p, 'rb').read()
          b64 = base64.b64encode(content).decode()
          url = f'https://api.github.com/repos/{repo}/contents/{p}'
          headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github+json'}
          req = urllib.request.Request(url, headers=headers)
          cur = json.load(urllib.request.urlopen(req))
          data = json.dumps({'message': 'add failure diagnostics to build workflow', 'content': b64, 'sha': cur['sha'], 'branch': 'main'}).encode()
          req2 = urllib.request.Request(url, data=data, headers=headers, method='PUT')
          resp = urllib.request.urlopen(req2)
          print('UPDATED', resp.status)
          PYEOF
