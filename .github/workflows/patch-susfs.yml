name: Patch SUSFS Source
on: workflow_dispatch
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit and push
        run: |
          git config user.name "Xiexiufyx"
          git config user.email "1054534375@qq.com"
          git add .github/actions/build-kernel/action.yml
          git commit -m "Switch SUSFS source to GitHub mirror (ShirkNeko)"
          git push
