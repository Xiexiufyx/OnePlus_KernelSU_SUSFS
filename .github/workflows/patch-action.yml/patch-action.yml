name: Patch action with diagnostics
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply patch
        env:
          B64: 

        run: |
          echo \"$B64\" | base64 -d > /tmp/p.py
          python3 /tmp/p.py
      - name: Verify
        run: |
          grep -c \"p_err\" .github/actions/build-kernel/action.yml || true
      - name: Commit and push
        run: |
          git config user.name \"Xiexiufyx\"
          git config user.email \"1054534375@qq.com\"
          git add -A
          git commit -m \"add patch failure diagnostics to build-kernel action\"
          git push origin HEAD:main
